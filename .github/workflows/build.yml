name: Build BannerBuilder
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Maven dependencies
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify
        run: mvn -B --no-transfer-progress clean verify
      - name: Stage deployable plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          files=(target/BannerBuilder-*.jar)
          deployable=()
          for file in "${files[@]}"; do
            name="${file##*/}"
            case "$name" in
              original-*|*-sources.jar|*-javadoc.jar|*-plain.jar|*-shaded.jar|*-dev.jar) continue ;;
            esac
            deployable+=("$file")
          done
          if (( ${#deployable[@]} != 1 )); then
            printf 'Expected 1 deployable JAR; found %s\n' "${#deployable[@]}" >&2
            printf '%s\n' "${deployable[@]}" >&2
            exit 1
          fi
          cp "${deployable[0]}" dist/
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          ls -lh dist/
      - name: Upload development JAR
        uses: actions/upload-artifact@v4
        with:
          name: BannerBuilder-dev-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
